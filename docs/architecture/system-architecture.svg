<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="990" viewBox="0 0 1320 990" role="img" aria-labelledby="title desc"><title id="title">AI Car Diagnostic Assistant — Architecture Overview</title><desc id="desc">Frontend requests go through FastAPI to diagnostics and persistent PostgreSQL. Diagnostic intelligence retrieves filtered technical evidence and uses OpenAI. A separate MCP pathway queries eBay for transient offers with unknown fitment. TecDoc is pending access and adapter implementation.</desc><defs><style>text{font-family:"Segoe UI",Arial,sans-serif}.connector{stroke-linecap:round}</style><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#386993" stroke-width="1.6"/></marker><marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#26856b" stroke-width="1.6"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#7962a3" stroke-width="1.6"/></marker><marker id="neutral-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#527393" stroke-width="1.6"/></marker><marker id="pending-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#9d6e25" stroke-width="1.6"/></marker></defs><rect width="1320" height="990" fill="#ffffff"/><rect x="24" y="25" width="42" height="42" rx="11" fill="#44779e" stroke="none" stroke-width="1.2"/><g transform="translate(32 33) scale(0.9)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m16 2-12 15h10l-1 9 12-16H15Z"/></g><text x="80" y="35" font-size="18" font-weight="600" fill="#112f4c" text-anchor="start"
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-car-diagnostic-backend"
version = "0.4.0"
description = "Persistent automotive diagnostic assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.36,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<0.5",
  "pymupdf>=1.25,<2",
  "python-multipart>=0.0.20,<1",
  "mcp==1.30.0",
  "httpx>=0.28,<1",
  "langchain-mcp-adapters==0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: paid OpenAI test, explicit opt-in", "database: real PostgreSQL integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
